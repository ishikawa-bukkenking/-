# data/menu.json などを直して保存(main に反映)すると、サイトが自動で作り直されて公開されます。
# 書き方をまちがえた(JSONが壊れた)ときは、ここで止まり、公開中のサイトはそのままです。
name: サイトを公開する
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: サイトを作る
        run: python3 build.py
      - name: リンク切れなどの確認
        run: python3 tools/verify.py --basic
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
