<!doctype html><html lang="ja"><meta charset="utf-8"><title>ラフ</title>
<style>
:root{--teal:#05968c;--ink:#374141;--paper:#fff;--tint:#e8f4f3;--line:#c9dcda;
--font:"Noto Sans JP","Yu Gothic","游ゴシック","Hiragino Sans","Hiragino Kaku Gothic ProN","Meiryo",sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font);color:var(--ink);background:#999}
.s{width:1920px;height:1080px;background:var(--paper);position:relative;overflow:hidden;margin-bottom:20px}
.foot{position:absolute;left:96px;right:96px;bottom:36px;display:flex;justify-content:space-between;font-size:24px;border-top:2px solid var(--line);padding-top:16px}
.logo-s{position:absolute;right:96px;top:48px;height:56px}
/* cover */
.cover .band{position:absolute;left:0;top:0;bottom:0;width:36px;background:var(--teal)}
.cover .logo{position:absolute;left:160px;top:120px;width:640px}
.cover h1{position:absolute;left:160px;top:420px;font-size:96px;line-height:1.25;font-weight:700}
.cover h1 small{display:block;font-size:56px;font-weight:500;margin-top:8px}
.cover p{position:absolute;left:160px;top:760px;font-size:36px;padding-left:24px;border-left:8px solid var(--teal)}
/* body */
h2{position:absolute;left:96px;top:72px;font-size:64px;font-weight:700;padding-left:28px;border-left:12px solid var(--teal)}
.grid{position:absolute;left:96px;right:96px;top:196px;display:grid;grid-template-columns:1fr 1fr;gap:32px}
.card{background:var(--tint);border-radius:20px;padding:24px 48px 28px;border-top:10px solid var(--teal)}
.card .n{font-size:104px;font-weight:700;line-height:1.1}
.card .l{font-size:36px;font-weight:700;margin:6px 0 10px}
.card .d{font-size:28px;line-height:1.6}
.note{position:absolute;left:96px;top:936px;font-size:26px}
</style>
