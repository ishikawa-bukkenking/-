<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>エリア調査シート 入力システム</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{--teal:#007482;--teal-l:#E0F2F4;--accent:#FFAB40;--text:#212121;--sub:#595959;--line:#d5dde0;--bg:#F4F7F8;--warn:#b26a00;--warn-bg:#fff8ec;--err:#B00020;
 --f:"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:var(--f);color:var(--text);background:var(--bg);line-height:1.7;font-size:16px}
header.top{background:var(--teal);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:10;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:1.05rem;margin:0;flex:1;min-width:200px}
main{max-width:980px;margin:0 auto;padding:20px 16px 80px}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:10px 20px;background:var(--accent);color:var(--text);font-weight:700;text-decoration:none;display:inline-block;min-height:44px}
button.ghost,.btn.ghost{background:#fff;color:var(--teal);border:2px solid var(--teal)}
header button.ghost{background:transparent;color:#fff;border-color:#fff}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;width:100%;padding:10px 12px;border:1px solid #aab7bb;border-radius:8px;background:#fff;min-height:44px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--teal);outline-offset:1px}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:160px}
.chip{display:inline-block;border-radius:999px;padding:2px 12px;font-size:.8125rem;font-weight:700;background:var(--teal-l);color:var(--teal)}
.chip.need{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.msg{color:var(--err);font-size:.9375rem;margin-top:8px}
.note{font-size:.8125rem;color:var(--sub)}
.item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item b{font-size:1.05rem}
details.sec{background:#fff;border-radius:14px;margin-bottom:12px;overflow:hidden}
details.sec>summary{cursor:pointer;padding:14px 18px;font-weight:700;background:var(--teal);color:#fff;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec .body{padding:8px 18px 18px}
.field{padding:12px 0;border-bottom:1px solid #eef2f3}.field:last-child{border:0}
.field label{font-weight:500;display:block;margin-bottom:4px}
.req{font-size:.75rem;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:0 6px;margin-left:6px;font-weight:700}
.field.need input{border-color:var(--warn);background:var(--warn-bg)}
.field.bad input{border-color:var(--err)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cols span{font-size:.75rem;color:var(--sub);display:block}
.hint{font-size:.8125rem;color:var(--sub);margin-top:4px}
.err{font-size:.8125rem;color:var(--err);margin-top:4px}
.imgbox{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.imgbox img{max-height:90px;max-width:160px;border:1px solid var(--line);border-radius:6px;background:#fff}
.imgbox input[type=file]{display:none}
.frlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 14px;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.frrow{display:flex;gap:8px;align-items:flex-start;font-weight:400;cursor:pointer}
.frrow b{font-weight:600}
.tbl{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:.8125rem}
.tbl td,.tbl th{border:1px solid var(--line);padding:0}
.tbl input{width:4.5em;border:0;padding:6px 4px;text-align:right;min-height:32px}
.tbl th input{font-weight:700;background:var(--teal-l);text-align:center;width:5.5em}
.tbl .warn{color:#B00020;font-size:.8125rem;margin:6px 0}
.field.off{opacity:.45}
.imgbox .paste{border:2px dashed var(--teal);border-radius:10px;padding:10px 14px;font-size:.875rem;color:var(--teal);background:var(--teal-l);cursor:pointer;min-height:44px;display:flex;align-items:center}
.imgbox .paste:focus{outline:3px solid var(--teal)}
.tbl{width:100%;border-collapse:collapse}.tbl td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
label.chk{display:flex;gap:8px;align-items:center;min-height:44px}label.chk input{width:auto;min-height:0}
#miss{margin:0;padding-left:1.2em;font-size:.875rem}
#miss li{margin:2px 0}
#saved{font-size:.875rem}
@media (max-width:640px){main{padding:12px 12px 80px}.card{padding:14px}}
</style></head><body>
<header class="top"><h1 id="title">エリア調査シート 入力システム</h1><span id="hstat" class="chip" hidden></span><span id="saved"></span>
<span id="who" class="note" style="color:#cfeaee"></span>
<button class="ghost" id="navlist" hidden>一覧</button><button class="ghost" id="navfr" hidden>加盟店</button><button class="ghost" id="navset" hidden>設定</button></header>
<main id="main"><div class="card"><p class="note">読み込み中…</p></div></main>
<script>
var imgs = {}, autoHouseholds = null, lastImg = null, cur = null, dirty = {}, timer = null, saving = false, meta = [], vals = {}, PREFS = [];
var $ = function (id) { return document.getElementById(id); };
function el(tag, attrs, kids) {
  var e = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) { if (k === 'text') e.textContent = attrs[k]; else if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); });
  (kids || []).forEach(function (c) { e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function call(name, args, ok, fail) {
  busy(true);
  var r = google.script.run.withSuccessHandler(function (res) { busy(false); ok(res); })
    .withFailureHandler(function (e) { busy(false); var m = String(e && e.message || e).replace(/^Error:\s*/, ''); if (fail) fail(m); else show(m, true); });
  r[name].apply(r, args);
}
function busy(b) { document.body.style.cursor = b ? 'progress' : ''; }
function show(msg, bad) { var m = $('msg'); if (m) { m.textContent = msg; m.className = bad ? 'msg' : 'note'; } else if (bad) { $('main').insertBefore(el('div', { class: 'card' }, [el('p', { class: 'msg', text: msg })]), $('main').firstChild); } }
function setSaved(t, bad) { var s = $('saved'); s.textContent = t; s.style.color = bad ? '#ffd0d0' : '#fff'; }
function chrome(title, inEdit) { $('title').textContent = title; $('hstat').hidden = !inEdit; setSaved(''); ['navlist', 'navfr', 'navset'].forEach(function (i) { $(i).hidden = false; }); }
function armed(btn, label, doIt) {
  var a = false, orig = btn.textContent;
  btn.onclick = function () { if (!a) { a = true; btn.textContent = label; setTimeout(function () { a = false; btn.textContent = orig; }, 4000); return; } doIt(); };
}
function copyText(t, btn) {
  var done = function () { var o = btn.textContent; btn.textContent = 'コピーしました'; setTimeout(function () { btn.textContent = o; }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function () { prompt('コピーしてください', t); });
  else prompt('コピーしてください', t);
}
/* 市区町村の入力候補(政令指定都市は「横浜市」と「横浜市中区」の両方)。都道府県を選ぶたびに取得 */
var cityCache = {};
function cityList() { var d = document.getElementById('citylist'); if (!d) { d = el('datalist', { id: 'citylist' }); document.body.appendChild(d); } return d; }
function loadCities(pref) {
  var d = cityList(); d.replaceChildren();
  if (!pref) return;
  var fill = function (a) { if (cityList() === d) a.forEach(function (n) { d.appendChild(el('option', { value: n })); }); };
  if (cityCache[pref]) { fill(cityCache[pref]); return; }
  google.script.run.withSuccessHandler(function (a) { cityCache[pref] = a; fill(a); }).withFailureHandler(function () {}).api_cities(pref);
}
function withCities(sel, inp) { inp.setAttribute('list', 'citylist'); var h = sel.onchange; sel.addEventListener('change', function () { loadCities(sel.value); }); if (sel.value) loadCities(sel.value); }
function prefSelect(sel) { var s = el('select', {}); [''].concat(PREFS).forEach(function (p) { var o = el('option', { value: p, text: p || '都道府県' }); if (p === sel) o.selected = true; s.appendChild(o); }); return s; }

/* ---- 一覧(会社 > エリア) ---- */
function viewList() {
  cur = null; chrome('会社とエリアの一覧', false);
  call('api_list', [], function (r) {
    var wrap = el('div', {});
    var add = el('div', { class: 'card' }, [el('h2', { text: '新しい会社を追加', style: 'margin-top:0;font-size:1.1rem' })]);
    var c1 = el('input', { id: 'nc', placeholder: '先方の会社名(例: 株式会社○○)' }), sel = prefSelect(''), c3 = el('input', { id: 'ncity', placeholder: '最初のエリアの市区町村(例: 上田市 / 横浜市中区)' });
    sel.id = 'np'; withCities(sel, c3);
    var ab = el('button', { text: '追加して入力を始める' });
    ab.onclick = function () {
      if (!c1.value.trim() || !sel.value || !c3.value.trim()) { $('msg').textContent = '会社名・都道府県・市区町村を入力してください。'; return; }
      call('api_create_company', [c1.value, sel.value, c3.value], function (x) { openArea(x.areaId); });
    };
    add.appendChild(el('div', { class: 'row' }, [el('div', { class: 'grow' }, [c1]), el('div', { style: 'width:150px;flex:none' }, [sel]), el('div', { class: 'grow' }, [c3]), ab]));
    add.appendChild(el('p', { id: 'msg', class: 'msg' }));
    wrap.appendChild(add);
    if (!r.hasUrl) wrap.appendChild(el('div', { class: 'card' }, [el('p', { class: 'msg', text: 'LPのURLを作れません。ウェブアプリとしてデプロイしたあと、「設定」の「LPの公開URL」を入力してください。' })]));
    else if (r.provisional) wrap.appendChild(el('div', { class: 'card', style: 'border:2px solid #b26a00;background:#fff8ec' }, [el('p', { class: 'note', style: 'color:#5a3600', text: '※いま表示しているLPのURLは「仮」です(この入力システム自身のURLで作っています)。社内の人しか開けない場合があります。お客様に見せるURLにするには、「設定」で「LPの公開URL」(LP用に「全員」でデプロイしたウェブアプリのURL)を入力してください。' })]));
    if (!r.companies.length) wrap.appendChild(el('div', { class: 'card' }, [el('p', { class: 'note', text: 'まだありません。上のフォームから追加してください。' })]));
    r.companies.forEach(function (c) { wrap.appendChild(companyCard(c, r)); });
    $('main').replaceChildren(wrap);
  });
}
function companyCard(c, r) {
  var card = el('div', { class: 'card' }), head = el('div', { class: 'row', style: 'margin-bottom:6px' });
  var nameEl = el('h2', { text: c.name, style: 'margin:0;font-size:1.15rem;flex:1;min-width:200px' });
  var ren = el('button', { class: 'ghost', text: '会社名を変更' });
  ren.onclick = function () {
    var inp = el('input', { value: c.name, style: 'flex:1;min-width:200px' }), ok = el('button', { text: '保存' });
    ok.onclick = function () { call('api_rename_company', [c.id, inp.value], function () { viewList(); }); };
    head.replaceChildren(inp, ok); inp.focus();
  };
  var del = el('button', { class: 'ghost', text: '会社を削除' }); armed(del, 'エリアも全部消えます。もう一度押すと削除', function () { call('api_delete_company', [c.id], function () { viewList(); }); });
  var dup = el('button', { class: 'ghost', text: '複製' });
  dup.onclick = function () {
    var inp = el('input', { value: c.name + '（コピー）', style: 'flex:1;min-width:200px', 'aria-label': '複製後の会社名' }), ok = el('button', { text: 'この名前で複製する' }), cancel = el('button', { class: 'ghost', text: 'やめる' });
    ok.onclick = function () { call('api_duplicate_company', [c.id, inp.value], function (x) { viewList(); }); };
    cancel.onclick = function () { viewList(); };
    head.replaceChildren(inp, ok, cancel); inp.focus(); inp.select();
  };
  head.appendChild(nameEl); head.appendChild(dup); head.appendChild(ren); head.appendChild(del); card.appendChild(head);
  if (c.areas.length) card.appendChild(el('p', { class: 'note', style: 'margin:0 0 4px', text: '「複製」で、この会社のエリアと入力内容・画像をそのまま別の会社としてコピーできます(同じエリアで別の会社に提案するときに便利です)。' }));
  c.areas.forEach(function (a) {
    var row = el('div', { class: 'item' }, [el('div', { class: 'grow' }, [el('b', { text: a.city }), el('span', { class: 'note', text: '　' + a.pref + '　' }), el('span', { class: 'chip' + (a.done ? '' : ' need'), text: a.status })])]);
    var ed = el('button', { text: '入力する' }); ed.onclick = function () { openArea(a.id); }; row.appendChild(ed);
    if (a.url) { row.appendChild(el('a', { class: 'btn ghost', href: a.url, target: '_blank', rel: 'noopener', text: 'LPを開く' }));
      var cp = el('button', { class: 'ghost', text: 'URLをコピー' }); cp.onclick = function () { copyText(a.url, cp); }; row.appendChild(cp);
      row.appendChild(el('div', { style: 'flex-basis:100%;word-break:break-all;order:5' }, [el('span', { class: 'note', text: 'LPのURL' + (r.provisional ? '(仮)' : '') + '：' }), el('a', { href: a.url, target: '_blank', rel: 'noopener', style: 'font-size:.875rem', text: a.url })])); }
    var dl = el('button', { class: 'ghost', text: '削除' }); armed(dl, 'もう一度押すと削除', function () { call('api_delete_area', [a.id], function () { viewList(); }); }); row.appendChild(dl);
    card.appendChild(row);
  });
  var f = el('div', { class: 'row', style: 'margin-top:12px' }), sel = prefSelect(''), ci = el('input', { placeholder: 'エリアを追加(市区町村 例: 東御市 / 横浜市中区)' }), ab = el('button', { class: 'ghost', text: 'エリアを追加' });
  ab.onclick = function () { if (!sel.value || !ci.value.trim()) { show('都道府県と市区町村を入力してください。', true); return; } call('api_add_area', [c.id, sel.value, ci.value], function (x) { openArea(x.areaId); }); };
  withCities(sel, ci);
  f.appendChild(el('div', { style: 'width:150px;flex:none' }, [sel])); f.appendChild(el('div', { class: 'grow' }, [ci])); f.appendChild(ab); card.appendChild(f);
  return card;
}
function openArea(id) { location.hash = 'id=' + id; route(); }

/* ---- 入力画面 ---- */
function splitCols(v, n) { var a = String(v || '').split(/[,，]/).map(function (x) { return x.trim(); }); while (a.length < n) a.push(''); return a; }
function joinCols(a) { return a.every(function (x) { return !x.trim(); }) ? '' : a.map(function (x) { return x.trim(); }).join(','); }
function markDirty(k, v) { dirty[k] = v; vals[k] = v; refreshNeed(); setSaved('入力中…'); clearTimeout(timer); timer = setTimeout(flush, 700); }
function flush() {
  if (saving) { timer = setTimeout(flush, 400); return; }
  var ch = dirty; dirty = {}; if (!Object.keys(ch).length) return;
  saving = true; setSaved('保存中…');
  google.script.run.withSuccessHandler(function (r) {
    saving = false;
    document.querySelectorAll('.field').forEach(function (f) { f.classList.remove('bad'); var e = f.querySelector('.err'); if (e) e.remove(); });
    var bad = Object.keys(r.errors);
    bad.forEach(function (k) { var f = document.querySelector('[data-k="' + k + '"]'); if (f) { f.classList.add('bad'); f.appendChild(el('div', { class: 'err', text: r.errors[k] + '(この項目は保存されていません)' })); } });
    setSaved(bad.length ? '保存できない項目があります' : '保存しました ' + new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }), bad.length > 0);
    loadStatus();
  }).withFailureHandler(function (e) { saving = false; setSaved('保存に失敗: ' + (e.message || e), true); Object.keys(ch).forEach(function (k) { dirty[k] = ch[k]; }); })
    .api_save(cur, ch);
}
function refreshNeed() {
  document.querySelectorAll('.field[data-req="1"]').forEach(function (f) {
    var v = vals[f.getAttribute('data-k')], off = f.getAttribute('data-grp') === 'trend' && !trendOn();
    f.classList.toggle('need', !off && (!v || !String(v).replace(/[,，\s]/g, '')));
  });
  document.querySelectorAll('details.sec').forEach(function (d) {
    var n = d.querySelectorAll('.field.need').length, c = d.querySelector('.cnt');
    c.textContent = n ? '未入力 ' + n : '入力済み'; c.style.opacity = n ? '1' : '.7';
  });
}
function loadStatus() {
  google.script.run.withSuccessHandler(function (s) {
    var chip = $('stat'); if (!chip || !cur) return;
    var n = s.error ? null : s.missing.length;
    var hs = $('hstat'); hs.hidden = false; hs.textContent = s.error ? '確認できません' : n ? '未入力 ' + n + '件' : '入力完了'; hs.className = 'chip' + (n ? ' need' : '');
    chip.textContent = s.error ? s.error : n ? '未入力・未取得 ' + n + '件' : '入力完了'; chip.className = 'chip' + (n ? ' need' : '');
    var ul = $('miss'); ul.replaceChildren();
    s.missing.slice(0, 40).forEach(function (m) { ul.appendChild(el('li', { text: m.label })); });
    s.checksNg.forEach(function (c) { ul.appendChild(el('li', { text: '整合性チェックNG: ' + c, style: 'color:#B00020' })); });
    var pc = $('pinchk'); if (!pc) { pc = el('div', { id: 'pinchk', class: 'note', style: 'margin-top:12px' }); ul.parentNode.appendChild(pc); }
    pc.replaceChildren();
    if (s.pins && s.pins.length) {
      pc.appendChild(el('div', { text: '地図のピンの位置(違っていたら住所を直してください)', style: 'font-weight:700;margin-bottom:4px' }));
      s.pins.forEach(function (p) {
        var li = el('div', { style: 'margin:2px 0' });
        li.appendChild(document.createTextNode((p.kind === 'client' ? '御社' : p.n + '. ' + p.name) + '：' + p.address + ' → '));
        if (p.lat != null) {
          li.appendChild(el('a', { href: 'https://www.google.com/maps?q=' + p.lat + ',' + p.lng, target: '_blank', rel: 'noopener', text: '地図で確認(' + (p.source || '') + (p.precise ? '' : '・概算') + ')' }));
          if (!p.on_map) li.appendChild(el('span', { text: ' ※' + p.why, style: 'color:#B00020' }));
        } else li.appendChild(el('span', { text: 'ピンなし: ' + p.why, style: 'color:#B00020' }));
        pc.appendChild(li);
      });
    }
    var t = $('totals'); if (t) t.textContent = s.totals && s.totals.listings_total != null ? '物件総数 ' + s.totals.listings_total + '件 / 仲介単価 約' + s.totals.brokerage + '万円' : '';
  }).withFailureHandler(function () {}).api_status(cur);
}
function shrink(file, cb, fail) {
  if (!/^image\/(jpeg|png|webp|gif)$/.test(file.type)) { fail('JPEG・PNGなどの画像を選んでください。'); return; }
  var rd = new FileReader();
  rd.onerror = function () { fail('画像を読み込めませんでした。'); };
  rd.onload = function () {
    var im = new Image();
    im.onerror = function () { fail('画像を開けませんでした。'); };
    im.onload = function () {
      var max = 1600, k = Math.min(1, max / Math.max(im.width, im.height)), cv = document.createElement('canvas');
      cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
      var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(im, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/jpeg', 0.82));
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
}
function uploadImageFile(f, fl, st, th, sync) {
  st.textContent = '処理中…'; setSaved('画像をアップロード中…');
  shrink(fl, function (uri) {
    th.src = uri; th.hidden = false;
    google.script.run.withSuccessHandler(function () { imgs[f.k] = true; tables[f.k] = null; sync(); setSaved('画像を保存しました'); loadStatus(); if (isTbl(f.k)) { if (aiReady) readTableAI(f); else if (f.tb) renderTable(f); } })
      .withFailureHandler(function (e) { st.textContent = '失敗: ' + (e.message || e); setSaved('画像を保存できませんでした', true); }).api_uploadImage(cur, f.k, uri);
  }, function (m) { st.textContent = m; setSaved(m, true); });
}
var tables = {}, aiReady = false;
function isTbl(k) { return /^inputs\.(used_house|used_mansion|new_house)\.heatmap_image$|^inputs\.price_trend\.image$/.test(k); }
function readTableAI(f) {
  f.tb.replaceChildren(el('p', { class: 'note', text: 'AIで画像から表を読み取っています…(10〜30秒ほどかかります)' }));
  google.script.run.withSuccessHandler(function (t) { tables[f.k] = t; f.fresh = true; setSaved('AIが表を作りました'); renderTable(f); loadStatus(); })
    .withFailureHandler(function (e) { renderTable(f, 'AIで読み取れませんでした: ' + (e.message || e) + '。画像のままLPに表示されます。'); }).api_readTable(cur, f.k, true);

      line('LPの公開URL', 'url', r.url, 'お客様に見せる「LP用」にデプロイしたウェブアプリのURL(https://script.google.com/macros/s/…/exec)。各エリアのLPのURLは、これに ?id=… を付けたものになります'),
      line('県との差が「同程度」とみなす範囲(ポイント)', 'threshold', r.threshold, '価格推移の文章で「同程度」と判定する範囲'),
      line('e-Stat アプリケーションID', 'estat', r.estat, '入れると、世帯数が空欄のエリアで国勢調査から自動取得します'),
      line('AI(Claude)のAPIキー' + (r.aiKeySet ? '(設定済み・変更するときだけ入力)' : '(未設定)'), 'ai', '', '画像の分布表を、内容そのままの表に作り直すために使います。画像はAnthropic社のAPIに送られます。キーはスプレッドシートには保存されません。空のまま保存すると今のキーを残し、「削除」と入力すると消えます')]);
    var sv = el('button', { text: '保存する' });
    sv.onclick = function () {
      call('api_settings_set', [{ url: f.url.value, max: r.max, threshold: f.threshold.value, estat: f.estat.value }], function () {
        var k = f.ai.value.trim();
        if (!k) { $('msg').textContent = '保存しました'; $('msg').className = 'note'; return; }
        call('api_ai_set', [k === '削除' ? '' : k], function () { f.ai.value = ''; $('msg').textContent = '保存しました(AIのAPIキーも更新)'; $('msg').className = 'note'; });
      });
    };
    var tb = el('button', { class: 'ghost', text: 'e-Statの接続テスト', style: 'margin-left:8px' });
    tb.onclick = function () {
      $('msg').textContent = 'テスト中…'; $('msg').className = 'note';
      call('api_estat_test', [f.estat.value], function (x) { $('msg').textContent = x.message; $('msg').className = x.ok ? 'note' : 'msg'; });
    };
    card.appendChild(sv); card.appendChild(tb); card.appendChild(el('p', { id: 'msg', class: 'note' }));
    card.appendChild(el('p', { class: 'note', text: 'ログイン中: ' + r.email }));
    $('main').replaceChildren(card);
  });
}

/* ---- ルーティング・起動 ---- */
function route() {
  var h = location.hash || '', m = /id=([A-Za-z0-9]+)/.exec(h);
  if (m) viewEdit(m[1]); else if (h === '#fr') viewFranchises(); else if (h === '#set') viewSettings(); else viewList();
}
function flushNow(next) { clearTimeout(timer); if (Object.keys(dirty).length || saving) { flush(); setTimeout(next, 900); } else next(); }
$('navlist').onclick = function () { flushNow(function () { location.hash = ''; route(); }); };
$('navfr').onclick = function () { flushNow(function () { location.hash = 'fr'; route(); }); };
$('navset').onclick = function () { flushNow(function () { location.hash = 'set'; route(); }); };
window.addEventListener('beforeunload', function (e) { if (Object.keys(dirty).length) { flush(); e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('hashchange', function () { if ($('who').textContent) route(); });

google.script.run.withSuccessHandler(function (r) { $('who').textContent = r.email; route(); })
  .withFailureHandler(function (e) {
    $('main').replaceChildren(el('div', { class: 'card', style: 'max-width:560px;margin:40px auto' }, [el('h2', { text: '入力システムを開けません', style: 'margin-top:0' }), el('p', { class: 'msg', text: String(e && e.message || e).replace(/^Error:\s*/, '') })]));
  }).api_whoami();
